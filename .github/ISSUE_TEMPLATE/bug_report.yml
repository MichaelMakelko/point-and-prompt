name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Claude Code with ...
        2. Open http://localhost:3000
        3. Press Alt+Shift+P and ...
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Where does it fail?
      options:
        - Chrome extension (overlay, screenshot, dictation)
        - Channel server (no session found, port, startup)
        - Claude Code does not react to the message
        - Not sure
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `claude --version` and `node --version`, plus your browser and its version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server log lines start with `[point-and-prompt]`. Extension errors are under chrome://extensions > point-and-prompt > Errors. Remove private paths and page content first.
      render: text
